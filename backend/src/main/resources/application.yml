server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/huamaodb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    # 数据库账号密码通过环境变量注入，避免明文提交到仓库
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  type-aliases-package: com.example.catforum.entity
  configuration:
    map-underscore-to-camel-case: true

# 阿里云 OSS 配置
# 敏感密钥一律通过环境变量注入，不要写进本文件
# Windows: set OSS_ACCESS_KEY_ID=xxx
# Linux/macOS: export OSS_ACCESS_KEY_ID=xxx
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:http://oss-cn-qingdao.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:huamaoss}
    domain: ${OSS_DOMAIN:https://huamaoss.oss-cn-qingdao.aliyuncs.com/}

logging:
  level:
    com.example.catforum: debug
