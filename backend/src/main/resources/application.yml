server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/huamaodb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  type-aliases-package: com.example.catforum.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.catforum: debug
